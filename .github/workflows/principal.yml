name: Tests

on:
  pull_request:
    branches:
      - principal

env:
  LLVM_VERSION_MAJOR: 23
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install LLVM 23 on Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common ninja-build
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION_MAJOR }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-${{ env.LLVM_VERSION_MAJOR }}-dev clang-${{ env.LLVM_VERSION_MAJOR }}
          echo "LLVM_DIR=/usr/lib/llvm-${{ env.LLVM_VERSION_MAJOR }}/cmake" >> $GITHUB_ENV
          # clang para os testes que compilam e executam programas (ex.: argumentos-execucao).
          sudo ln -sf /usr/bin/clang-${{ env.LLVM_VERSION_MAJOR }} /usr/local/bin/clang

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn testes-unitarios

      - name: Upload coverage reports
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        continue-on-error: true

  arc-sanitizadores:
    name: ARC with AddressSanitizer + LeakSanitizer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install LLVM 23, sanitizer runtime and C libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common ninja-build
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION_MAJOR }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          # libclang-rt: runtime do ASan/LSan; libssl/libcurl: módulos criptografia e http.
          sudo apt-get install -y llvm-${{ env.LLVM_VERSION_MAJOR }}-dev clang-${{ env.LLVM_VERSION_MAJOR }} \
            libclang-rt-${{ env.LLVM_VERSION_MAJOR }}-dev libssl-dev libcurl4-openssl-dev
          echo "LLVM_DIR=/usr/lib/llvm-${{ env.LLVM_VERSION_MAJOR }}/cmake" >> $GITHUB_ENV
          sudo ln -sf /usr/bin/clang-${{ env.LLVM_VERSION_MAJOR }} /usr/local/bin/clang

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Todo o tempo de execução C compila, inclusive os módulos que dependem de OpenSSL e libcurl.
      - name: Check C runtime sources
        run: |
          for arquivo in fontes/bibliotecas/*.c; do
            clang -fsyntax-only -Wall -Werror=implicit-function-declaration -Werror=int-conversion \
              -Werror=incompatible-pointer-types -I fontes/bibliotecas "$arquivo"
          done

      # Programas compilados com ASan + LSan (DELEGUA_FLAGS_C), no modo estrito do ARC
      # (testes/configuracao-arc.ts), incluindo a suíte de estresse.
      - name: Run execution and stress tests with sanitizers
        env:
          DELEGUA_FLAGS_C: -fsanitize=address -fno-omit-frame-pointer
          DELEGUA_TESTES_ESTRESSE: '1'
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
        run: yarn testes-unitarios --coverage=false testes/compilador-llvm.arc testes/compilador-llvm.vetores-execucao testes/compilador-llvm.despacho-execucao testes/bibliotecas/arc testes/bibliotecas/argumentos-execucao testes/bibliotecas/http-execucao

  compilacao-cruzada:
    name: Cross-compile (zig)
    runs-on: ubuntu-24.04

    env:
      ZIG_VERSION: 0.17.0
      # SHA-256 de zig-x86_64-linux-0.17.0.tar.xz, conforme https://ziglang.org/download/index.json
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache-zig

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install LLVM 23 on Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common ninja-build
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ env.LLVM_VERSION_MAJOR }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-${{ env.LLVM_VERSION_MAJOR }}-dev
          echo "LLVM_DIR=/usr/lib/llvm-${{ env.LLVM_VERSION_MAJOR }}/cmake" >> $GITHUB_ENV

      - name: Install qemu and cross C libraries (to run arm64/riscv64 binaries)
        run: sudo apt-get install -y file qemu-user libc6-arm64-cross libc6-riscv64-cross

      - name: Install zig ${{ env.ZIG_VERSION }}
        run: |
          arquivo="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/${arquivo}" -o "${RUNNER_TEMP}/${arquivo}"
          echo "${ZIG_SHA256}  ${RUNNER_TEMP}/${arquivo}" | sha256sum -c -
          tar -xf "${RUNNER_TEMP}/${arquivo}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      # zig compila a biblioteca C/C++ de cada alvo no primeiro uso; o cache evita refazer isso.
      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('fontes/bibliotecas/**', 'testes/compilacao-cruzada/**') }}
          restore-keys: zig-${{ env.ZIG_VERSION }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cross-compile and run sample program
        run: bash testes/compilacao-cruzada/verificar.sh
